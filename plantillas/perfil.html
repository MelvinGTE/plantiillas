<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-container narrow">
        <!-- Encabezado de la página -->
        <header class="header">
            <div>
                <h1>Perfil de Usuario</h1>
                <p>Gestiona tu información personal y credenciales de acceso</p>
            </div>
            <a href="menu.html" class="btn-back">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span>Menú Principal</span>
            </a>
        </header>

        <!-- Banner de Perfil -->
        <div class="profile-card">
            <div class="avatar-large">M</div>
            <div class="profile-info">
                <h2>Melvin Güité</h2>
                <p>Administrador - Agencia Central</p>
            </div>
        </div>

        <!-- Información Personal -->
        <section class="card">
            <h2 class="card-title">Información Personal</h2>
            <form id="profileForm" onsubmit="saveProfile(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="profName">Nombre Completo</label>
                        <input type="text" id="profName" value="Melvin Güité" required>
                    </div>

                    <div class="form-group">
                        <label for="profEmail">Correo Electrónico</label>
                        <input type="email" id="profEmail" value="melvin@dominio.com" required>
                    </div>

                    <div class="form-group">
                        <label for="profAgency">Agencia Asignada</label>
                        <input type="text" id="profAgency" value="Agencia Central" disabled>
                    </div>

                    <div class="form-group">
                        <label for="profRole">Rol de Sistema</label>
                        <input type="text" id="profRole" value="Administrador" disabled>
                    </div>
                </div>

                <div class="actions end">
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </section>

        <!-- Seguridad -->
        <section class="card">
            <h2 class="card-title">Seguridad y Contraseña</h2>
            <form id="securityForm" onsubmit="updatePassword(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="currPass">Contraseña Actual</label>
                        <input type="password" id="currPass" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label for="newPass">Nueva Contraseña</label>
                        <input type="password" id="newPass" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="actions end">
                    <button type="submit" class="btn btn-primary">Actualizar Contraseña</button>
                </div>
            </form>
        </section>
    </div>

    <script>
        function saveProfile(e) {
            e.preventDefault();
            alert('¡Información personal actualizada con éxito!');
        }

        function updatePassword(e) {
            e.preventDefault();
            alert('¡Contraseña actualizada con éxito!');
            document.getElementById('securityForm').reset();
        }
    </script>
</body>
</html>
