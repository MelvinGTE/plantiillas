<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-container">
        <!-- Header con Botón del Menú -->
        <header class="header">
            <div>
                <h1>Gestión de Usuarios</h1>
                <p>Administra accesos, altas, bajas y modificaciones del personal</p>
            </div>
            <div class="header-actions">
                <a href="menu.html" class="btn-back">
                    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Menú</span>
                </a>
                <button class="btn btn-primary" onclick="openDrawerForCreate()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Nuevo Usuario
                </button>
            </div>
        </header>

        <!-- Tarjeta Principal -->
        <section class="card">
            <!-- Toolbar de Búsqueda -->
            <div class="toolbar">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Buscar por nombre, correo o agencia..." onkeyup="filterTable()">
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Correo Electrónico</th>
                            <th>Agencia</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal Lateral / Drawer (Formulario de Altas y Cambios) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="handleOverlayClick(event)">
        <div class="drawer">
            <div>
                <div class="drawer-header">
                    <h2 id="drawerTitle">Nuevo Usuario</h2>
                    <button class="close-btn" onclick="closeDrawer()">&times;</button>
                </div>

                <form class="drawer-form" id="userForm" onsubmit="saveUser(event)">
                    <input type="hidden" id="userId">

                    <div class="form-group">
                        <label for="userName">Nombre Completo</label>
                        <input type="text" id="userName" required placeholder="Ej. Melvin Güité">
                    </div>

                    <div class="form-group">
                        <label for="userEmail">Correo Electrónico</label>
                        <input type="email" id="userEmail" required placeholder="ejemplo@correo.com">
                    </div>

                    <div class="form-group">
                        <label for="userAgency">Agencia Asignada</label>
                        <select id="userAgency" required>
                            <option value="Agencia Central">Agencia Central</option>
                            <option value="Agencia Zona 10">Agencia Zona 10</option>
                            <option value="Agencia Plaza">Agencia Plaza</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="userRole">Rol del Sistema</label>
                        <select id="userRole" required>
                            <option value="Asesor Comercial">Asesor Comercial</option>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="userStatus">Estado</label>
                        <select id="userStatus" required>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo (Baja)</option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="drawer-footer">
                <button type="button" class="btn btn-secondary" onclick="closeDrawer()">Cancelar</button>
                <button type="submit" form="userForm" class="btn btn-primary" id="saveBtn">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // Datos iniciales de ejemplo
        let users = [
            { id: 1, name: 'Melvin Güité', email: 'melvin@dominio.com', agency: 'Agencia Central', role: 'Administrador', status: 'Activo' },
            { id: 2, name: 'Carolina Reyes', email: 'creyes@dominio.com', agency: 'Agencia Zona 10', role: 'Supervisor', status: 'Activo' },
            { id: 3, name: 'Juan Pérez', email: 'jperez@dominio.com', agency: 'Agencia Plaza', role: 'Asesor Comercial', status: 'Inactivo' }
        ];

        // Función para renderizar la tabla
        function renderUsers(userList = users) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (userList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 24px;">No se encontraron registros.</td></tr>`;
                return;
            }

            userList.forEach(user => {
                const badgeClass = user.status === 'Activo' ? 'badge-active' : 'badge-inactive';
                const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';

                const row = `
                    <tr>
                        <td>
                            <div class="user-cell">
                                <div class="avatar-small">${initial}</div>
                                <strong>${user.name}</strong>
                            </div>
                        </td>
                        <td>${user.email}</td>
                        <td>${user.agency}</td>
                        <td>${user.role}</td>
                        <td><span class="badge ${badgeClass}">${user.status}</span></td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn btn-icon btn-edit" onclick="openDrawerForEdit(${user.id})" title="Editar usuario">Editar</button>
                                <button class="btn btn-icon btn-delete" onclick="toggleUserStatus(${user.id})" title="Cambiar estado">
                                    ${user.status === 'Activo' ? 'Baja' : 'Alta'}
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // --- Funciones para Altas, Bajas y Cambios ---

        function openDrawerForCreate() {
            document.getElementById('drawerTitle').textContent = 'Nuevo Usuario';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('drawerOverlay').classList.add('active');
        }

        function openDrawerForEdit(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;

            document.getElementById('drawerTitle').textContent = 'Editar Usuario';
            document.getElementById('userId').value = user.id;
            document.getElementById('userName').value = user.name;
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userAgency').value = user.agency;
            document.getElementById('userRole').value = user.role;
            document.getElementById('userStatus').value = user.status;

            document.getElementById('drawerOverlay').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('active');
        }

        function handleOverlayClick(event) {
            if (event.target.id === 'drawerOverlay') {
                closeDrawer();
            }
        }

        // Función centralizada para Guardar (Alta o Cambio)
        function saveUser(event) {
            event.preventDefault();

            const id = document.getElementById('userId').value;
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const agency = document.getElementById('userAgency').value;
            const role = document.getElementById('userRole').value;
            const status = document.getElementById('userStatus').value;

            if (id) {
                // Cambio (Edición)
                const index = users.findIndex(u => u.id == id);
                if (index !== -1) {
                    users[index] = { id: parseInt(id), name, email, agency, role, status };
                }
            } else {
                // Alta (Creación)
                const newId = users.length ? Math.max(...users.map(u => u.id)) + 1 : 1;
                users.push({ id: newId, name, email, agency, role, status });
            }

            filterTable();
            closeDrawer();
        }

        // Función para Bajas/Altas rápidas directas desde la tabla
        function toggleUserStatus(id) {
            const user = users.find(u => u.id === id);
            if (user) {
                user.status = user.status === 'Activo' ? 'Inactivo' : 'Activo';
                filterTable();
            }
        }

        // Filtro de Búsqueda rápida
        function filterTable() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!term) {
                renderUsers(users);
                return;
            }

            const filtered = users.filter(u => 
                u.name.toLowerCase().includes(term) ||
                u.email.toLowerCase().includes(term) ||
                u.agency.toLowerCase().includes(term) ||
                u.role.toLowerCase().includes(term)
            );
            renderUsers(filtered);
        }

        // Carga inicial
        document.addEventListener('DOMContentLoaded', () => {
            renderUsers();
        });
    </script>
</body>
</html>
