<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Módulo de Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container">
        <!-- Header -->
        <header class="header">
            <h1>Bienvenido de nuevo</h1>
            <p>Ingresa tus credenciales para acceder al sistema</p>
        </header>

        <!-- Tarjeta de Login -->
        <div class="card">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="username">Usuario o Correo</label>
                        <input type="text" id="username" name="username" placeholder="ejemplo@dominio.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="forgot-password">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-submit" onclick="window.location.href='menu.html'">Iniciar Sesión</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
