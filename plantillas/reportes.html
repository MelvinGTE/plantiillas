<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Reportería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-container">
        <!-- Header con Botón de Regreso -->
        <header class="header">
            <div>
                <h1>Módulo de Reportería</h1>
                <p>Genera y exporta reportes detallados de prospectos y créditos</p>
            </div>
            <a href="menu.html" class="btn-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Menú Principal</span>
            </a>
        </header>

        <!-- Tarjeta de Filtros -->
        <section class="card">
            <h2 class="card-title">Filtros de Búsqueda</h2>
            <form id="filterForm" onsubmit="applyFilters(event)">
                <div class="filter-grid">
                    <div class="form-group">
                        <label for="fecha_inicio">Fecha Inicial</label>
                        <input type="date" id="fecha_inicio" name="fecha_inicio" required>
                    </div>

                    <div class="form-group">
                        <label for="fecha_fin">Fecha Final</label>
                        <input type="date" id="fecha_fin" name="fecha_fin" required>
                    </div>

                    <div class="form-group">
                        <label for="division">División</label>
                        <select id="division" name="division">
                            <option value="todas">Todas las divisiones</option>
                            <option value="norte">GT1</option>
                            <option value="sur">GT2</option>
                            <option value="central">GT3</option>
                            <option value="GT4">GT4</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="agencia">Agencia</label>
                        <select id="agencia" name="agencia">
                            <option value="todas">Todas las agencias</option>
                            <option value="agencia_1">Zacapa</option>
                            <option value="agencia_2">Jalapa</option>
                            <option value="agencia_3">Chiquimula</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="usuario">Usuario / Asesor</label>
                        <select id="usuario" name="usuario">
                            <option value="todos">Todos los usuarios</option>
                            <option value="melvin">Melvin Güité</option>
                            <option value="carolina">Carolina Reyes</option>
                            <option value="juan">Juan Pérez</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button type="button" class="btn btn-secondary" onclick="resetFilters()">Limpiar</button>
                    <button type="submit" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        Consultar
                    </button>
                </div>
            </form>
        </section>

        <!-- Tarjeta de Resultados (Oculta por defecto hasta consultar) -->
        <section class="card hidden" id="resultsSection">
            <div class="results-header">
                <h2>Resultados de la Consulta</h2>
                <div class="export-actions">
                    <button type="button" class="btn btn-outline" onclick="exportData('excel')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        Exportar Excel
                    </button>
                    <button type="button" class="btn btn-outline" onclick="exportData('pdf')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                        Generar PDF
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Registro</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Agencia</th>
                            <th>Usuario</th>
                            <th>Monto (Q)</th>
                            <th>Tipo de Crédito</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <!-- Filas cargadas dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Datos simulados de respuesta con Tipo de Crédito
        const mockData = [
            { id: 'REG-1001', fecha: '2026-03-01', cliente: 'Carlos Mendoza', agencia: 'Agencia Zacapa', usuario: 'Melvin Güité', monto: 'Q 25,000.00', tipoCredito: 'Personal' },
            { id: 'REG-1002', fecha: '2026-03-01', cliente: 'Ana María López', agencia: 'Agencia Chiquimula', usuario: 'Carolina Reyes', monto: 'Q 50,000.00', tipoCredito: 'Productivo' },
            { id: 'REG-1003', fecha: '2026-03-02', cliente: 'Roberto Gómez', agencia: 'Agencia Jalapa', usuario: 'Juan Pérez', monto: 'Q 15,000.00', tipoCredito: 'Personal' },
            { id: 'REG-1004', fecha: '2026-03-02', cliente: 'Lucía Fernández', agencia: 'Agencia Jalapa', usuario: 'Melvin Güité', monto: 'Q 20,000.00', tipoCredito: 'Personal' }
        ];

        function applyFilters(event) {
            event.preventDefault();

            const fechaInicio = document.getElementById('fecha_inicio').value;
            const fechaFin = document.getElementById('fecha_fin').value;

            // Validación de rango de fechas
            if (fechaInicio && fechaFin && fechaInicio > fechaFin) {
                alert('La fecha inicial no puede ser posterior a la fecha final.');
                return;
            }

            const tableBody = document.getElementById('resultsTableBody');
            tableBody.innerHTML = '';

            mockData.forEach(item => {
                const row = `
                    <tr>
                        <td><strong>${item.id}</strong></td>
                        <td>${item.fecha}</td>
                        <td>${item.cliente}</td>
                        <td>${item.agencia}</td>
                        <td>${item.usuario}</td>
                        <td><strong>${item.monto}</strong></td>
                        <td>${item.tipoCredito}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            document.getElementById('resultsSection').classList.remove('hidden');
        }

        function resetFilters() {
            document.getElementById('filterForm').reset();
            document.getElementById('resultsTableBody').innerHTML = '';
            document.getElementById('resultsSection').classList.add('hidden');
        }

        function exportData(type) {
            alert(`Generando y descargando reporte en formato ${type.toUpperCase()}...`);
        }
    </script>
</body>
</html>
